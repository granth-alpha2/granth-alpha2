<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05010f"/>
      <stop offset="50%" stop-color="#170a35"/>
      <stop offset="100%" stop-color="#05010f"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c1fd6"/>
      <stop offset="50%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00e5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="fireGrad" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="35%" stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="#ff00e5" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="300" fill="url(#bgGrad)"/>

  <g fill="#ffffff">
    <circle cx="40" cy="40" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="80" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="35" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="100" r="1.2"><animate attributeName="opacity" values="1;0.15;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="370" cy="55" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="25" r="1.1"><animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="90" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="45" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="105" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="30" r="1.1"><animate attributeName="opacity" values="1;0.15;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="70" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="910" cy="40" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="95" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="140" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="150" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="135" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="150" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="140" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="150" r="1.3"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <g id="dragon">
    <animateMotion dur="11s" repeatCount="indefinite" rotate="auto"
      path="M -180,150 C 40,40 160,240 380,140 C 560,60 640,220 850,130 C 980,80 1050,150 1180,110" />

    <g id="wingBack" transform="translate(-15,5)" opacity="0.55">
      <polygon points="0,0 -55,-70 -20,-35 0,0" fill="url(#wingGrad)"/>
      <polygon points="0,0 -75,-40 -30,-15 0,0" fill="url(#wingGrad)"/>
      <animateTransform attributeName="transform" type="rotate"
        values="-8 -15 5; 34 -15 5; -8 -15 5" dur="0.85s" repeatCount="indefinite" additive="sum"/>
    </g>

    <path d="M -140,55 Q -95,15 -50,45 T 10,10 T 65,-15 T 95,-20"
      fill="none" stroke="url(#bodyGrad)" stroke-width="15" stroke-linecap="round" filter="url(#glow)"/>

    <g fill="#00f5ff" filter="url(#glow)">
      <polygon points="-105,20 -95,-2 -85,22"/>
      <polygon points="-65,10 -55,-14 -45,12"/>
      <polygon points="-20,20 -10,-4 0,22"/>
      <polygon points="25,-2 35,-24 45,0"/>
      <polygon points="65,-22 74,-42 82,-20"/>
    </g>

    <g id="tail">
      <path d="M -140,55 Q -175,50 -195,75 Q -210,92 -230,80"
        fill="none" stroke="url(#bodyGrad)" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>
      <polygon points="-230,80 -252,68 -244,88 -252,96" fill="#ff00e5" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="rotate"
        values="0 -140 55; 10 -140 55; -8 -140 55; 0 -140 55" dur="2.6s" repeatCount="indefinite"/>
    </g>

    <g id="wingFront" transform="translate(-15,5)">
      <polygon points="0,0 60,-85 20,-45 0,0" fill="url(#wingGrad)" filter="url(#softGlow)"/>
      <polygon points="0,0 82,-52 30,-18 0,0" fill="url(#wingGrad)" filter="url(#softGlow)"/>
      <polygon points="0,0 70,-18 25,4 0,0" fill="url(#wingGrad)" opacity="0.8"/>
      <animateTransform attributeName="transform" type="rotate"
        values="6 -15 5; -38 -15 5; 6 -15 5" dur="0.85s" repeatCount="indefinite" additive="sum"/>
    </g>

    <g id="head">
      <polygon points="80,-22 118,-34 142,-18 136,0 108,10 82,0"
        fill="url(#bodyGrad)" filter="url(#glow)"/>
      <polygon points="112,-32 120,-52 128,-30" fill="#00f5ff" filter="url(#glow)"/>
      <polygon points="98,-28 104,-46 110,-27" fill="#00f5ff" filter="url(#glow)"/>

      <circle cx="118" cy="-14" r="4.2" fill="#ff00e5" filter="url(#glow)">
        <animate attributeName="r" values="3.2;5;3.2" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.4s" repeatCount="indefinite"/>
      </circle>

      <g id="fireBreath">
        <ellipse cx="175" cy="-10" rx="34" ry="9" fill="url(#fireGrad)">
          <animate attributeName="rx" values="20;40;24" dur="0.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;0.95;0.5" dur="0.4s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="200" cy="-8" rx="22" ry="6" fill="url(#fireGrad)">
          <animate attributeName="rx" values="12;26;14" dur="0.35s" begin="0.1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.4;0.85;0.4" dur="0.35s" begin="0.1s" repeatCount="indefinite"/>
        </ellipse>
      </g>
    </g>
  </g>

  <text x="500" y="264" text-anchor="middle" font-family="Fira Code, monospace" font-size="20"
    fill="#00f5ff" filter="url(#softGlow)" letter-spacing="3">SYSTEM GUARDIAN // GRANTH.EXE</text>
</svg>

