name: Daily Green Contribution Graph & Snake Animation

on:
  schedule:
    # Runs at 6:00 AM IST every day
    - cron: '30 0 * * *'

  # Allows manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-daily-green-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Asia/Kolkata

    steps:
      # 1. Decide whether today is a commit day
      - name: Check Commit Pattern
        id: schedule
        run: |
          DAY_NUMBER=$(( $(date +%s) / 86400 ))

          # Repeating pattern:
          # SKIP, COMMIT, COMMIT, SKIP, SKIP
          PATTERN=("skip" "commit" "commit" "skip" "skip")

          INDEX=$(( DAY_NUMBER % 5 ))
          TODAY="${PATTERN[$INDEX]}"

          echo "Today's pattern: $TODAY"

          if [ "$TODAY" = "commit" ]; then
            echo "run_today=true" >> "$GITHUB_OUTPUT"
            echo "Today is a commit day."
          else
            echo "run_today=false" >> "$GITHUB_OUTPUT"
            echo "Skipping today's commit."
          fi

      # 2. Checkout repository on commit days only
      - name: Checkout Repository
        if: steps.schedule.outputs.run_today == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 3. Create assets directory
      - name: Ensure Assets Directory Exists
        if: steps.schedule.outputs.run_today == 'true'
        run: mkdir -p assets

      # 4. Generate Snake animation
      - name: Generate Contribution Snake Animation
        if: steps.schedule.outputs.run_today == 'true'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark&color_snake=#00F5FF&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353

      # 5. Update timestamp
      - name: Update Contribution Timestamp
        if: steps.schedule.outputs.run_today == 'true'
        run: |
          date +"%Y-%m-%d %H:%M:%S %Z" > assets/.daily-bump

      # 6. Commit and push changes
      - name: Commit and Push
        if: steps.schedule.outputs.run_today == 'true'
        run: |
          git config user.name "Granth Chauhan"
          git config user.email "chauhangranth02@gmail.com"

          git add assets/

          git commit -m "chore(activity): contribution graph update [skip ci]"

          git pull --rebase origin main

          git push origin main
